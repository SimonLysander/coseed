name: CoSeed CI

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, edited, ready_for_review]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: coseed-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  contribution:
    name: CoSeed contribution
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - name: Check source branch and PR title
        env:
          COSEED_PR_BRANCH: ${{ github.head_ref }}
          COSEED_PR_TITLE: ${{ github.event.pull_request.title }}
        run: node scripts/verify-contribution.mjs

  quality:
    name: CoSeed quality
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .node-version
          cache: npm
      - name: Use project npm
        run: npm install --global "$(node -p "require('./package.json').packageManager")"
      - run: npm ci
      - run: npm run check
      - name: Install browser
        run: npm exec playwright install --with-deps --no-shell chromium
      - run: npm run test:e2e
      - run: npm run test:design
      - run: npm run verify:package
